name: Weekly AI coding of scout submissions

# Runs code-submissions.js automatically every Friday at 08:00 South African
# time (06:00 UTC — SA has no DST, so this offset is constant year-round).
# The script itself already skips anything already coded, so this just
# processes whatever new submissions came in since the last run.
on:
  schedule:
    - cron: '0 6 * * 5'
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab too

jobs:
  code-submissions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Write .env for the script
        run: |
          cat <<EOF > .env
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          EOF

      - name: Run code-submissions.js
        run: node code-submissions.js
